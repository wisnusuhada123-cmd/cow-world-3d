<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cow World 3D</title><style>body{margin:0;font-family:system-ui;background:#a9dcf4}#hud{position:fixed;top:12px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}#hud span{background:#ffffffe8;padding:9px;border-radius:12px;font-weight:bold}#msg{position:fixed;top:80px;left:10px;right:10px;text-align:center;font-weight:bold;color:#23421c;text-shadow:0 1px white}#actions{position:fixed;bottom:15px;left:8px;right:8px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}button{padding:13px;border:0;border-radius:12px;background:white;font-weight:bold;box-shadow:0 2px 8px #0003}canvas{display:block}</style></head><body><div id="hud"><span id="grass">Rumput: 3</span><span id="clean">Bersih: 60%</span><span id="milk">Susu: 0 L</span></div><div id="msg">Selamat datang di Cow World!</div><div id="actions"><button id="find">Cari Rumput</button><button id="feed">Beri Makan</button><button id="wash">Mandikan</button><button id="extract">Perah Susu</button></div><script type="module">import * as THREE from 'https://esm.sh/three@0.160.1';const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8daf4);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(7,5,10);camera.lookAt(0,1.3,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x668844,2.3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,10,6);scene.add(light);const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const white=material(0xf7f5ec),black=material(0x28282a),pink=material(0xd99da2),green=material(0x70ae50);function cube(w,h,d,m,x,y,z,p=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o}function oval(w,h,d,m,x,y,z,p=scene){let o=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),m);o.scale.set(w,h,d);o.position.set(x,y,z);p.add(o);return o}cube(40,.2,40,green,0,-.15,0);const cow=new THREE.Group();scene.add(cow);oval(1.55,.9,.8,white,0,1.8,0,cow);oval(.7,.7,.6,white,1.5,2.05,0,cow);oval(.46,.3,.48,pink,2.05,1.85,0,cow);for(const x of [-.95,.9])for(const z of [-.48,.48])cube(.28,1.2,.28,white,x,.73,z,cow);oval(.52,.15,.4,pink,0,1.06,0,cow);for(const z of [-.46,.46]){oval(.13,.13,.12,black,2,2.35,z,cow);oval(.28,.12,.22,white,1.43,2.72,z*1.7,cow)}oval(.58,.35,.11,black,-.4,2.43,.73,cow);oval(.38,.26,.1,black,.55,1.55,-.74,cow);cube(.12,.8,.12,white,-1.55,1.42,0,cow);for(let i=0;i<45;i++){let x=(Math.random()-.5)*30,z=(Math.random()-.5)*30;if(Math.abs(x)<3&&Math.abs(z)<3)continue;cube(.14,.3,.14,material(0x4e9038),x,.12,z)}let grass=3,clean=60,milk=0,energy=2;function update(){document.querySelector('#grass').textContent='Rumput: '+grass;document.querySelector('#clean').textContent='Bersih: '+clean+'%';document.querySelector('#milk').textContent='Susu: '+milk+' L'}function msg(s){document.querySelector('#msg').textContent=s}document.querySelector('#find').onclick=()=>{grass+=2;msg('Dapat 2 rumput!');update()};document.querySelector('#feed').onclick=()=>{if(!grass)return msg('Cari rumput dahulu!');grass--;energy=Math.min(5,energy+1);msg('Sapi sudah makan!');update()};document.querySelector('#wash').onclick=()=>{clean=Math.min(100,clean+20);msg('Sapi menjadi bersih!');update()};document.querySelector('#extract').onclick=()=>{if(!energy)return msg('Beri makan sapi dahulu!');if(clean<40)return msg('Mandikan sapi dahulu!');energy--;milk++;clean=Math.max(0,clean-10);msg('Berhasil mendapat 1 liter susu!');update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(t){requestAnimationFrame(animate);cow.position.y=Math.sin(t*.002)*.04;cow.rotation.y=Math.sin(t*.0007)*.14;renderer.render(scene,camera)}requestAnimationFrame(animate);update();</script></body></html>
